name: Datos demo BI (cron diario)

# Mantiene viva la demo del municipio ficticio San Andres: TODOS LOS DIAS genera
# los reclamos (con historial, OT operativas y encuestas CSAT), los expedientes
# (tramites) y los turnos / llamados / Guardia / eventos demo del dia anterior
# completo (+7 dias de turnos reservados hacia adelante), y avanza el ciclo de
# vida de los pendientes demo con su plan SLA-aware (cada mes 60-85 % se cierra
# dentro del SLA). Endpoint: POST /api/v1/demo/poblar.
#
# Desde 2026-10-21 el cron es DIARIO y SIN fechas: el endpoint toma por defecto
# los 7 dias completos hasta ayer y reclamos/tramites SALTEAN los dias ya
# generados -> cada dia se genera una sola vez y, si el cron se saltea dias (o
# GitHub lo demora horas), la corrida siguiente los recupera sin duplicar. La
# atencion ya era idempotente por recurso/dia. Antes de llamar, el job verifica
# en /openapi.json que el backend desplegado tenga esa version (PoblarIn.modo y
# modulo 'tramites'): contra un backend viejo el cron diario duplicaria reclamos.
#
# El endpoint es ASINCRONO (desde 2026-09-22): responde 202 con id_corrida y este
# job hace polling de GET /api/v1/demo/poblar/{id_corrida} cada 20 s (hasta 40
# min) para volcar el JSON de conteos en el log (el edge de Railway corta toda
# respuesta a los ~300 s).
#
# Disparo manual con modo = cerrar_atraso: cierra de forma plausible lo viejo que
# quedo abierto (reclamos / tramites / emergencias de mas de 21 dias, con sus OT).
# Con aplicar=false (default) es un DRY-RUN: el JSON trae los conteos de lo que
# tocaria y la lista de lo que NO es del generador. incluir_no_demo=true suma los
# datos de QA / seed_tramites.py.
#
# Solo toca datos atribuidos al usuario 'generador.demo' (inactivo), salvo
# cerrar_atraso con incluir_no_demo. Ningun paso manda mails ni push.
#
# ALCANCE (definicion de Cesar 2026-08-30): este cron aplica datos SOLO al
# municipio DEMO (San Andres). Cuando llegue multi-tenant (IT-01), el generador
# debe quedar acotado al tenant demo — JAMAS generar datos en tenants reales.
#
# Auth: header X-Dispatcher-Token == env var DISPATCHER_TOKEN de Railway (el
# mismo token que usan los otros crons). Secrets del repo:
#   - ENCUESTAS_DISPATCHER_TOKEN  : mismo valor que Railway DISPATCHER_TOKEN
#   - ZARIS_API_URL (opcional)    : base de la API; default abajo
#
# Disparo manual: pestana Actions > este workflow > Run workflow.

on:
  schedule:
    # Todos los dias 08:20 UTC (05:20 en AR): agrega el dia anterior completo.
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      desde:
        description: 'Inicio del rango YYYY-MM-DD (vacio = 7 dias completos hasta ayer; max 45 dias)'
        required: false
        default: ''
      hasta:
        description: 'Fin del rango YYYY-MM-DD (vacio = ayer). Los dias ya generados se saltean'
        required: false
        default: ''
      modulos:
        description: 'reclamos,atencion,tramites (default los tres). En cerrar_atraso, atencion = emergencias'
        required: false
        default: 'reclamos,atencion,tramites'
      modo:
        description: 'poblar (generar + avanzar) | cerrar_atraso (cierra lo viejo abierto)'
        required: false
        default: 'poblar'
      aplicar:
        description: 'cerrar_atraso: true escribe; false = DRY-RUN (solo conteos)'
        required: false
        default: 'false'
      incluir_no_demo:
        description: 'cerrar_atraso: incluir datos de QA/seed que no son del generador'
        required: false
        default: 'false'
      rebalancear_sla:
        description: 'cerrar_atraso: llevar los meses viejos de reclamos con menos de 60 % dentro del SLA a su objetivo'
        required: false
        default: 'false'

concurrency:
  group: demo-datos
  cancel-in-progress: false

jobs:
  poblar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de datos demo
        env:
          API_URL: ${{ secrets.ZARIS_API_URL || 'https://zaris-api-production-bf0b.up.railway.app' }}
          TOKEN: ${{ secrets.ENCUESTAS_DISPATCHER_TOKEN }}
          DESDE: ${{ github.event.inputs.desde }}
          HASTA: ${{ github.event.inputs.hasta }}
          MODULOS: ${{ github.event.inputs.modulos }}
          MODO: ${{ github.event.inputs.modo }}
          APLICAR: ${{ github.event.inputs.aplicar }}
          NO_DEMO: ${{ github.event.inputs.incluir_no_demo }}
          REBALANCEAR: ${{ github.event.inputs.rebalancear_sla }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secret ENCUESTAS_DISPATCHER_TOKEN en el repo."
            exit 1
          fi

          URL="$API_URL/api/v1/demo/poblar"
          [ -z "$MODULOS" ] && MODULOS='reclamos,atencion,tramites'
          [ -z "$MODO" ] && MODO='poblar'
          [ "$APLICAR" = "true" ] || APLICAR='false'
          [ "$NO_DEMO" = "true" ] || NO_DEMO='false'
          [ "$REBALANCEAR" = "true" ] || REBALANCEAR='false'

          # Preflight: el backend desplegado tiene que ser la version idempotente por dia
          # (PoblarIn con 'modo' y el modulo 'tramites'). Contra un deploy viejo el cron
          # diario duplicaria reclamos: mejor fallar sin llamar.
          SPEC=$(mktemp)
          curl -sS -o "$SPEC" "$API_URL/openapi.json"
          if ! python3 -c 'import json,sys; p=json.load(open(sys.argv[1]))["components"]["schemas"]["PoblarIn"]["properties"]; sys.exit(0 if "modo" in p and "tramites" in json.dumps(p.get("modulos", {})) else 1)' "$SPEC"; then
            echo "::error::El backend desplegado todavia no tiene la version diaria de /demo/poblar (PoblarIn.modo / modulo 'tramites'). Mirar el deploy de Railway antes de correr: un backend viejo no es idempotente."
            exit 1
          fi

          # 'reclamos,atencion' -> ["reclamos","atencion"] (sin jq: awk)
          MODS_JSON=$(printf '%s' "$MODULOS" | tr -d ' ' | awk -F, '{ for (i=1;i<=NF;i++) printf "%s\"%s\"", (i>1?",":""), $i }')
          if [ "$MODO" = "cerrar_atraso" ]; then
            PAYLOAD=$(printf '{"modo":"cerrar_atraso","aplicar":%s,"incluir_no_demo":%s,"rebalancear_sla":%s,"modulos":[%s]}' "$APLICAR" "$NO_DEMO" "$REBALANCEAR" "$MODS_JSON")
          elif [ -n "$DESDE" ] && [ -n "$HASTA" ]; then
            PAYLOAD=$(printf '{"desde":"%s","hasta":"%s","modulos":[%s]}' "$DESDE" "$HASTA" "$MODS_JSON")
          else
            PAYLOAD=$(printf '{"modulos":[%s]}' "$MODS_JSON")
          fi
          echo "POST $URL body=$PAYLOAD"

          BODY=$(mktemp)
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' \
            -X POST "$URL" \
            -H "X-Dispatcher-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP $CODE"
          echo "Respuesta:"
          cat "$BODY"; echo

          if [ "$CODE" != "202" ]; then
            echo "::error::demo/poblar devolvio HTTP $CODE (esperado 202). 409 = otra corrida en curso o rango invalido; 422 = body invalido; 502 = el edge corto la respuesta. Los dias ya generados se saltean, pero revisar los conteos por dia en la DB antes de re-dispatchar."
            exit 1
          fi

          # El id_corrida es la PRIMERA clave del JSON; sin jq: grep de la primera ocurrencia.
          ID=$(grep -o '"id_corrida":[[:space:]]*"[0-9a-f]\{12\}"' "$BODY" | head -1 | sed 's/.*"\([0-9a-f]\{12\}\)"$/\1/')
          if [ -z "$ID" ]; then
            echo "::error::El 202 no trajo id_corrida."
            exit 1
          fi
          echo "Corrida $ID encolada. Consultando $URL/$ID cada 20 s (maximo 40 min)..."

          for i in $(seq 1 120); do
            sleep 20
            CODE=$(curl -sS -o "$BODY" -w '%{http_code}' \
              -H "X-Dispatcher-Token: $TOKEN" "$URL/$ID")
            if [ "$CODE" != "200" ]; then
              echo "::error::La consulta de la corrida $ID devolvio HTTP $CODE. 404 = la instancia se reinicio a mitad: verificar los conteos por dia en la DB antes de re-dispatchar."
              cat "$BODY"; echo
              exit 1
            fi
            # 'estado' de la corrida es la segunda clave del JSON (antes de 'resultado'):
            # la primera ocurrencia es la de la corrida, no la de un conteo anidado.
            ESTADO=$(grep -o '"estado":[[:space:]]*"[a-z_]*"' "$BODY" | head -1 | sed 's/.*"\([a-z_]*\)"$/\1/')
            case "$ESTADO" in
              ok)
                echo "Corrida $ID terminada OK (~$((i*20)) s). Resultado:"
                cat "$BODY"; echo
                exit 0
                ;;
              error)
                echo "::error::La corrida $ID termino con error (los pasos previos al fallo quedaron aplicados: ver 'resultado'). Detalle:"
                cat "$BODY"; echo
                exit 1
                ;;
              en_curso)
                echo "  ... en curso ($((i*20)) s)"
                ;;
              *)
                echo "::error::Estado desconocido '$ESTADO' en la respuesta:"
                cat "$BODY"; echo
                exit 1
                ;;
            esac
          done

          echo "::error::La corrida $ID no termino en 40 min. Mirar los logs de Railway ('demo/poblar') y los conteos por dia en la DB antes de re-dispatchar."
          exit 1

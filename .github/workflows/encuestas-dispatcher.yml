name: Encuestas dispatcher (cron horario)

# Llama cada hora al endpoint dispatcher de encuestas en prod (Railway):
#   1. Envia los envios 'pendiente' con fecha_alta < NOW() - 24h.
#   2. Marca 'expirada' los 'enviada'/'abierta' con fecha_expiracion vencida.
#
# El endpoint NO usa JWT: se autentica con el header X-Dispatcher-Token, que
# debe coincidir EXACTAMENTE con la env var DISPATCHER_TOKEN de Railway
# (compare_digest — cuidado con espacios/newline al pegar el secret, ver
# CLAUDE.md). Secrets requeridos en el repo (Settings > Secrets > Actions):
#   - ENCUESTAS_DISPATCHER_TOKEN  : mismo valor que Railway DISPATCHER_TOKEN
#   - ZARIS_API_URL (opcional)    : base de la API; default abajo
#
# Disparo manual: pestaña Actions > este workflow > Run workflow.

on:
  schedule:
    # Cada hora en punto (UTC). GitHub Actions no garantiza el minuto exacto;
    # el endpoint es idempotente, asi que un disparo tardio no rompe nada.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: encuestas-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al dispatcher
        env:
          API_URL: ${{ secrets.ZARIS_API_URL || 'https://zaris-api-production-bf0b.up.railway.app' }}
          TOKEN: ${{ secrets.ENCUESTAS_DISPATCHER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secret ENCUESTAS_DISPATCHER_TOKEN en el repo."
            exit 1
          fi

          URL="$API_URL/api/v1/admin/encuestas/dispatcher/ejecutar"
          echo "POST $URL"

          # -sS: silencioso pero muestra errores. -f hace que curl falle (exit 22)
          # ante HTTP >= 400. Capturamos cuerpo y codigo por separado para loguear.
          BODY=$(mktemp)
          CODE=$(curl -sS -o "$BODY" -w '%{http_code}' \
            -X POST "$URL" \
            -H "X-Dispatcher-Token: $TOKEN" \
            -H "Content-Type: application/json")

          echo "HTTP $CODE"
          echo "Respuesta:"
          cat "$BODY"; echo

          if [ "$CODE" != "200" ]; then
            echo "::error::Dispatcher devolvio HTTP $CODE (esperado 200)."
            exit 1
          fi

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZARIS · Iniciar sesión</title>
  <script>
    // Tema claro/oscuro: mismo localStorage del shell (zaris_theme). Antes de los CSS.
    try { if (localStorage.getItem('zaris_theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="../design-system/assets/zaris-favicon.svg">
  <link rel="stylesheet" href="../design-system/fonts/fonts.css">
  <link rel="stylesheet" href="../design-system/colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--zaris-cream);
      font-family: var(--font-display);
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface-100);
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 40px 36px 36px;
      box-shadow: 0 2px 16px rgba(38,37,30,.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .brand__mark {
      width: 28px;
      height: 28px;
      color: var(--fg-1);
    }

    .brand__name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.8px;
      color: var(--fg-1);
    }

    .brand__app {
      padding-left: 10px;
      margin-left: 2px;
      border-left: 1px solid var(--border-medium);
      font-size: 13px;
      font-weight: 500;
      color: var(--fg-2);
      letter-spacing: .01em;
    }

    .login-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--fg-1);
      margin-bottom: 4px;
      letter-spacing: -0.4px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--fg-3);
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--fg-2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-medium);
      border-radius: 7px;
      background: var(--surface-100);
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--fg-1);
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input:focus {
      border-color: var(--zaris-orange);
      box-shadow: 0 0 0 3px rgba(245,78,0,.12);
    }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 10px 16px;
      background: var(--fg-1);
      color: var(--zaris-cream);
      border: none;
      border-radius: 7px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .btn-submit:hover { background: #3a3930; }
    .btn-submit:disabled { opacity: .5; cursor: default; }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(207,45,86,.08);
      border: 1px solid rgba(207,45,86,.2);
      border-radius: 7px;
      font-size: 13px;
      color: var(--color-error);
    }

    .error-msg.visible { display: block; }

    .login-foot {
      margin-top: 24px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-4);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <svg class="brand__mark" viewBox="0 0 500 500" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="34"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M 110 78 L 388 78"/>
        <path d="M 388 78 L 110 430"/>
        <path d="M 388 220 L 222 430"/>
        <path d="M 388 362 L 334 430"/>
      </g>
    </svg>
    <span class="brand__name">ZARIS</span>
    <span class="brand__app">Gestión Estado</span>
  </div>

  <h1 class="login-title" id="login-title">Iniciar sesión</h1>

  <form id="login-form">
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" autocomplete="username"
             placeholder="usuario@municipio.gob.ar" required />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password"
             placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn-submit" id="btn-submit">Ingresar</button>
    <div class="error-msg" id="error-msg"></div>
  </form>

  <!-- Cambio de contraseña forzado en primer ingreso (clave temporal, Fase 3).
       Oculto por default; se muestra cuando el login devuelve debe_cambiar_password. -->
  <form id="cambio-form" style="display:none;">
    <p style="font-size:13.5px;color:var(--fg-3);line-height:1.5;margin:0 0 18px;">
      Tu contraseña es temporal. Por seguridad, elegí una nueva para terminar de ingresar.
    </p>
    <div class="field">
      <label for="pass-nueva">Nueva contraseña</label>
      <input type="password" id="pass-nueva" autocomplete="new-password"
             placeholder="Mínimo 8 caracteres" required />
    </div>
    <div class="field">
      <label for="pass-confirma">Repetir contraseña</label>
      <input type="password" id="pass-confirma" autocomplete="new-password"
             placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn-submit" id="btn-cambio">Guardar y entrar</button>
    <div class="error-msg" id="cambio-error"></div>
  </form>

  <p class="login-foot">zaris-zge · v0.1</p>
</div>

<script>
  const _local = ['localhost', '127.0.0.1', '0.0.0.0'];
  const API_BASE = _local.includes(window.location.hostname)
    ? 'http://127.0.0.1:8000'
    : 'https://zaris-api-production-bf0b.up.railway.app';

  // Si ya hay sesión, ir al shell
  if (localStorage.getItem('zaris_session')) {
    window.location.href = '../index.html';
  }

  const form    = document.getElementById('login-form');
  const btn     = document.getElementById('btn-submit');
  const errorEl = document.getElementById('error-msg');

  // Cambio forzado de contraseña (Fase 3)
  const cambioForm  = document.getElementById('cambio-form');
  const cambioError = document.getElementById('cambio-error');
  const btnCambio   = document.getElementById('btn-cambio');
  const loginTitle  = document.getElementById('login-title');
  let _tokenTemporal = null;   // token del login con clave temporal
  let _userTemporal  = null;

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
  }

  function hideError() {
    errorEl.classList.remove('visible');
  }

  function persistirSesion(token, user) {
    // Publica AMBAS shapes en la misma clave (§29).
    localStorage.setItem('zaris_session', JSON.stringify({
      access_token: token,
      user: user,
      state: { accessToken: token, user: user },
      version: 0,
    }));
  }

  function mostrarCambioForzado(token, user) {
    _tokenTemporal = token;
    _userTemporal = user;
    form.style.display = 'none';
    loginTitle.textContent = 'Cambiá tu contraseña';
    cambioForm.style.display = 'block';
    document.getElementById('pass-nueva').focus();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideError();
    btn.disabled = true;
    btn.textContent = 'Ingresando…';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch(`${API_BASE}/api/v1/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.detail || 'Error al iniciar sesión.');
        return;
      }

      // Primer ingreso con clave temporal: NO guardamos sesión todavía, forzamos
      // el cambio de contraseña antes de dejar entrar (Fase 3).
      if (data.user && data.user.debe_cambiar_password) {
        mostrarCambioForzado(data.access_token, data.user);
        return;
      }

      // Login normal: persistir sesión (ambas shapes, §29) y entrar al shell.
      persistirSesion(data.access_token, data.user);
      window.location.href = '../index.html';

    } catch (err) {
      showError('No se pudo conectar con el servidor. Verificá que el backend esté activo.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  });

  // Handler del cambio forzado de contraseña.
  cambioForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    cambioError.classList.remove('visible');
    const nueva    = document.getElementById('pass-nueva').value;
    const confirma = document.getElementById('pass-confirma').value;

    if (nueva.length < 8) {
      cambioError.textContent = 'La contraseña debe tener al menos 8 caracteres.';
      cambioError.classList.add('visible');
      return;
    }
    if (nueva !== confirma) {
      cambioError.textContent = 'Las contraseñas no coinciden.';
      cambioError.classList.add('visible');
      return;
    }

    btnCambio.disabled = true;
    btnCambio.textContent = 'Guardando…';
    try {
      const res = await fetch(`${API_BASE}/api/v1/auth/cambiar-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${_tokenTemporal}`,
        },
        body: JSON.stringify({ password_nueva: nueva }),
      });
      const data = await res.json();
      if (!res.ok) {
        cambioError.textContent = data.detail || 'No se pudo cambiar la contraseña.';
        cambioError.classList.add('visible');
        return;
      }
      // Cambio OK: la marca ya quedó en FALSE. Persistimos la sesión (el token
      // sigue siendo válido) y entramos al shell.
      const userOk = Object.assign({}, _userTemporal, { debe_cambiar_password: false });
      persistirSesion(_tokenTemporal, userOk);
      window.location.href = '../index.html';
    } catch (err) {
      cambioError.textContent = 'No se pudo conectar con el servidor.';
      cambioError.classList.add('visible');
    } finally {
      btnCambio.disabled = false;
      btnCambio.textContent = 'Guardar y entrar';
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de vecinos</title>
  <link rel="icon" type="image/svg+xml" href="../design-system/assets/zaris-favicon.svg">
  <link rel="stylesheet" href="../design-system/fonts/fonts.css">
  <link rel="stylesheet" href="../design-system/colors_and_type.css">
  <style>
    body { margin: 0; background: var(--zaris-cream); color: var(--fg-1); font-family: var(--font-display), Arial, sans-serif; padding: 48px 16px; }
    .card { max-width: 480px; margin: 0 auto; background: var(--surface-100); border: 1px solid var(--border-primary); border-radius: 14px; padding: 28px 24px; text-align: center; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { margin: 0; color: var(--fg-2); line-height: 1.55; }
  </style>
</head>
<body>
  <!-- El registro vive en el portal del vecino (PLAN_REGISTRO_PREVIO.md §6). Esta página queda para los
       enlaces y QR que ya circulan: lleva al portal del municipio del enlace (?m=) o de la dirección. -->
  <div class="card" role="status">
    <h1 id="titulo">Te llevamos al registro…</h1>
    <p id="texto">El registro se hace en el portal del vecino.</p>
  </div>
  <script>
    (function () {
      var local = ['localhost', '127.0.0.1'].indexOf(window.location.hostname) !== -1;
      var api = local ? 'http://127.0.0.1:8000' : 'https://zaris-api-production-bf0b.up.railway.app';
      var m = (new URLSearchParams(window.location.search).get('m') || '').trim();
      function aviso(t, x) {
        document.getElementById('titulo').textContent = t;
        document.getElementById('texto').textContent = x;
      }
      fetch(api + '/api/v1/publico/alta/identidad' + (m ? '?m=' + encodeURIComponent(m) : ''))
        .then(function (r) {
          if (r.status === 404) { aviso('Municipio no encontrado', 'El enlace no corresponde a un municipio válido.'); return null; }
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (d) {
          if (!d) return;
          var portal = (d.app_vecinos_url || '').trim();
          if (!/^https?:\/\//.test(portal)) { aviso('El registro no está disponible', 'Acercate al municipio para registrarte.'); return; }
          window.location.replace(portal.replace(/\/+$/, '') + '/registro');
        })
        .catch(function () { aviso('No pudimos abrir el registro', 'Revisá tu conexión y volvé a intentar.'); });
    })();
  </script>
</body>
</html>

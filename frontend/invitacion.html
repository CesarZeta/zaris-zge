<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZARIS · Elegí tu contraseña</title>
  <script>
    // Tema claro/oscuro: mismo localStorage del shell (zaris_theme). Antes de los CSS.
    try { if (localStorage.getItem('zaris_theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="../design-system/assets/zaris-favicon.svg">
  <link rel="stylesheet" href="../design-system/fonts/fonts.css">
  <link rel="stylesheet" href="../design-system/colors_and_type.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
           background: var(--zaris-cream); font-family: var(--font-display); color: var(--fg-1); }
    .card { width: 100%; max-width: 380px; background: var(--surface-100); border: 1px solid var(--border-primary);
            border-radius: 12px; padding: 36px 32px; box-shadow: 0 2px 16px rgba(38,37,30,.08); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-weight: 700; letter-spacing: .04em; }
    .brand span { color: var(--zaris-orange); }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.5; color: var(--fg-2); margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
            color: var(--fg-3); margin: 14px 0 6px; }
    input { width: 100%; padding: 10px 12px; font: inherit; font-size: 15px; color: var(--fg-1);
            background: var(--surface-100); border: 1px solid var(--border-medium); border-radius: 8px; }
    button { width: 100%; margin-top: 22px; padding: 12px; font: inherit; font-weight: 600; font-size: 15px;
             color: #fff; background: var(--zaris-orange); border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .error { margin-top: 14px; font-size: 13px; color: var(--color-error); min-height: 1em; }
    .hint { font-size: 12px; color: var(--fg-3); margin-top: 6px; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">ZARIS <span>·</span> GESTION ESTADO</div>
  <h1>Elegí tu contraseña</h1>
  <p id="intro">Es el primer paso para entrar. Después vas a vincular una app de códigos en el celular
    (Google Authenticator, Microsoft Authenticator o similar).</p>
  <form id="form">
    <label for="p1">Contraseña</label>
    <input type="password" id="p1" autocomplete="new-password" required minlength="8" />
    <div class="hint">Al menos 8 caracteres.</div>
    <label for="p2">Repetila</label>
    <input type="password" id="p2" autocomplete="new-password" required minlength="8" />
    <button type="submit" id="btn">Guardar y seguir</button>
    <div class="error" id="error"></div>
  </form>
</div>
<script>
  (function () {
    const _local = ['localhost', '127.0.0.1', '0.0.0.0'];
    const API_BASE = _local.includes(window.location.hostname)
      ? 'http://127.0.0.1:8000'
      : 'https://zaris-api-production-bf0b.up.railway.app';
    const token = (new URLSearchParams(window.location.search).get('t') || '').trim();
    const form = document.getElementById('form');
    const err = document.getElementById('error');
    const btn = document.getElementById('btn');
    const INVALIDA = 'El enlace venció o ya se usó. Pedí al soporte de ZARIS que te reenvíe la invitación.';

    if (!token) { err.textContent = INVALIDA; btn.disabled = true; return; }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      err.textContent = '';
      const p1 = document.getElementById('p1').value;
      const p2 = document.getElementById('p2').value;
      if (p1.length < 8) { err.textContent = 'La contraseña debe tener al menos 8 caracteres.'; return; }
      if (p1 !== p2) { err.textContent = 'Las dos contraseñas no coinciden.'; return; }
      btn.disabled = true; btn.textContent = 'Guardando…';
      try {
        const res = await fetch(`${API_BASE}/api/v1/auth/invitacion/aceptar`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: p1 }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          err.textContent = res.status === 401 ? INVALIDA : (typeof data.detail === 'string' ? data.detail : 'No se pudo guardar la contraseña.');
          return;
        }
        // La vinculación de la app sigue en el login, con su mismo flujo (frontend/login.html).
        // Sin segundo factor (local), el login solo muestra el aviso.
        sessionStorage.setItem('zaris_sf_pendiente', JSON.stringify(data));
        window.history.replaceState({}, '', window.location.pathname);
        window.location.replace('login.html');
      } catch (e2) {
        err.textContent = 'No se pudo conectar con el servidor.';
      } finally {
        btn.disabled = false; btn.textContent = 'Guardar y seguir';
      }
    });
  })();
</script>
</body>
</html>
